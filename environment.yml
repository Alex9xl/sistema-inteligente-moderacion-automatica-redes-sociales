name: tesis-proyecto
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - pytorch::pytorch::*=*cuda*
  - pytorch::pytorch-cuda=11.8
  - pytorch::pytorch-lightning
  - pytorch::torchvision
  - pytorch::torchaudio
  - pip
  - pip:
    - transformers>=4.40,<5.0
    - datasets>=2.18
    - scikit-learn>=1.4
    - pandas>=2.1
    - numpy>=1.26
    - pyarrow>=15.0
    - fastapi>=0.110
    - uvicorn[standard]>=0.27
    - pydantic>=2.6
    - pydantic-settings>=2.0
    - shap>=0.45
    - statsmodels>=0.14
    - matplotlib>=3.8
    - seaborn>=0.13
    - emoji>=2.10
    - unidecode>=1.3
    - regex>=2024.0
    - python-dotenv>=1.0
    - pytest>=8.0
    - pytest-cov>=5.0
    - httpx>=0.27
    - ftfy>=6.0
